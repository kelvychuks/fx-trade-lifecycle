name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Integration tests start PostgreSQL through Testcontainers using the
      # runner's Docker daemon.
      - name: Build and run tests
        run: mvn -B verify

      - name: Verify the production image builds
        run: docker build -t fx-trade-lifecycle:ci .
