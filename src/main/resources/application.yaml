spring:
  application:
    name: fx-trade-lifecycle

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fxdesk}
    username: ${DATABASE_USERNAME:fxdesk}
    password: ${DATABASE_PASSWORD:fxdesk}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities still match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Dev-only fallback. Production MUST set JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    issuer: fx-trade-lifecycle

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  trading:
    # How far a manually dealt rate may sit from the market before it is
    # rejected. 0.05 = 5%.
    off-market-tolerance: ${OFF_MARKET_TOLERANCE:0.05}

  valuation:
    scheduled: ${VALUATION_SCHEDULED:true}
    # 22:30 UTC on weekdays, after the New York close.
    cron: ${VALUATION_CRON:0 30 22 * * MON-FRI}

  demo:
    # Seeds users, two weeks of market data and a book of trades into an empty
    # database. Turn off for anything that is not a demo.
    seed: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: ${PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.codewithkelvin.fx: ${APP_LOG_LEVEL:INFO}
