# Render blueprint. Create a PostgreSQL database first (Render or Neon), then
# New -> Blueprint -> this repo.
#
# DATABASE_URL must be the JDBC form, which is not the URL the provider shows:
#   they give   postgresql://user:pass@host/db
#   Spring needs jdbc:postgresql://host/db?sslmode=require  plus user/password
services:
  - type: web
    name: fx-trade-lifecycle
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      # One instance only on the free plan, so the scheduled valuation is safe
      # to leave on. With replicas it needs a lock — see EndOfDayScheduler.
      - key: VALUATION_SCHEDULED
        value: "true"
