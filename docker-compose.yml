# `docker compose up` gives you a migrated, seeded desk on :8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fxdesk
      POSTGRES_USER: fxdesk
      POSTGRES_PASSWORD: fxdesk
    ports:
      - "5432:5432"
    volumes:
      - fx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxdesk -d fxdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fxdesk
      DATABASE_USERNAME: fxdesk
      DATABASE_PASSWORD: fxdesk
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  fx-db-data:
